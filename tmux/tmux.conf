##### Terminal capabilities #####

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


##### General behavior #####

# Enable mouse selection, pane resizing, and window switching
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Close numbering gaps after deleting a window
set -g renumber-windows on

# Keep plenty of terminal history
set -g history-limit 100000

# Improve responsiveness for Escape-based shortcuts
set -sg escape-time 10

# Let terminal applications detect focus changes
set -g focus-events on

# Use Vim-style controls in copy mode
setw -g mode-keys vi


##### Reload configuration #####

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"


##### Pane creation #####

# Split panes while preserving the current directory
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


##### Pane navigation #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Hold Prefix and repeatedly press Shift + H/J/K/L to resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5


##### Pablo Workspace colors #####

# Main status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0D1117,fg=#6E7681"

# Session label on the left
set -g status-left-length 40
set -g status-left "#[fg=#0D1117,bg=#56D4DD,bold] 󰆍  #S #[fg=#56D4DD,bg=#0D1117]"

# Information on the right
set -g status-right-length 100
set -g status-right "#[fg=#56D364,bold]#{?client_prefix, PREFIX ,}#[fg=#6E7681,nobold]│ #[fg=#79C0FF]  #{b:pane_current_path} #[fg=#6E7681]│ #[fg=#D8DEE9]%a %b %d  %I:%M %p "

# Inactive window tabs
setw -g window-status-format "#[fg=#6E7681,bg=#0D1117]  #I:#W  "

# Active window tab
setw -g window-status-current-format "#[fg=#0D1117,bg=#E3B341,bold]  #I:#W  "

set -g window-status-separator " "


##### Pane borders #####

set -g pane-border-style "fg=#30363D"
set -g pane-active-border-style "fg=#56D4DD"

# Display pane names and directories along the upper border
set -g pane-border-status top
set -g pane-border-format " #[fg=#6E7681]#P #[fg=#D8DEE9,bold]#{pane_title} #[fg=#6E7681,nobold]· #{b:pane_current_path} "


##### Messages and selection #####

set -g message-style "bg=#161B22,fg=#56D4DD,bold"
set -g message-command-style "bg=#161B22,fg=#E3B341,bold"

setw -g mode-style "bg=#E3B341,fg=#0D1117,bold"
setw -g clock-mode-colour "#E3B341"
