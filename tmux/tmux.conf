##### Terminal capabilities #####

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Agent Deck / AI CLI compatibility
set -s extended-keys on
# csi-u formatting is available starting with tmux 3.5.
if-shell -F '#{>=:#{version},3.5}' 'set -s extended-keys-format csi-u'
set -as terminal-features 'tmux-256color:extkeys'
set -ag terminal-overrides ",*256col*:Tc"


##### General behavior #####

# Enable mouse selection, pane resizing, and window switching
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Close numbering gaps after deleting a window
set -g renumber-windows on

# Keep plenty of terminal history
set -g history-limit 100000

# Improve responsiveness for Escape-based shortcuts
set -sg escape-time 10

# Let terminal applications detect focus changes
set -g focus-events on

# Use Vim-style controls in copy mode
setw -g mode-keys vi


##### Reload configuration #####

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"


##### Pane creation #####

# Split panes while preserving the current directory
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


##### Pane navigation #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Hold Prefix and repeatedly press Shift + H/J/K/L to resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5


##### Pablo Workspace appearance #####

# Shared dark palette: keep tmux close to the terminal, prompt, and editor.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0D1117,fg=#6E7681"

# Session label: cyan is reserved for the primary structural accent.
set -g status-left-length 32
set -g status-left "#[fg=#56D4DD,bold] 󰆍  #[fg=#D8DEE9]#S #[fg=#30363D,nobold]│"

# Keep the right side lightweight: tmux's native clock format does not spawn
# a shell, and the prompt already provides the current directory.
set -g status-right-length 48
set -g status-right "#[fg=#56D4DD,bold]#{?client_prefix, PREFIX ,}#[fg=#30363D,nobold]│ #[fg=#6E7681]%a %b %d  #[fg=#D8DEE9]%H:%M "

# Muted windows recede into the bar; the active window uses a restrained
# blue surface instead of the previous yellow block.
setw -g window-status-format "#[fg=#6E7681,bg=#0D1117]  #I:#W  "

setw -g window-status-current-format "#[fg=#D8DEE9,bg=#212736,bold]  #I:#W  "

set -g window-status-separator " "


##### Pane borders #####

set -g pane-border-style "fg=#30363D"
set -g pane-active-border-style "fg=#79C0FF"

# Show the pane number and title without repeating the current directory.
# pane_title remains useful for host/workspace names set by the shell or th.
set -g pane-border-status top
set -g pane-border-format " #[fg=#6E7681]#P  #[fg=#D8DEE9]#{pane_title} "


##### Messages and selection #####

set -g message-style "bg=#161B22,fg=#56D4DD,bold"
set -g message-command-style "bg=#161B22,fg=#79C0FF,bold"

setw -g mode-style "bg=#79C0FF,fg=#0D1117,bold"
setw -g clock-mode-colour "#79C0FF"
